[project]
name = "tinyjobs"
version = "0.1.0"
description = ""
authors = [
    {name = "ksredkin",email = "ksredkin0968@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "aiosqlite (>=0.20.0,<1.0.0)",
]


[tool.ruff]
line-length = 88
target-version = "py314" # Python 3.14
exclude = ["venv", "versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.4.1,<3.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "pytest-coverage (>=0.0,<0.1)"
]
